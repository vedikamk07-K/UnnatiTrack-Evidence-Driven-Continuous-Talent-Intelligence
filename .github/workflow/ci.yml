name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Backend seed/rules are in sync with the frontend engine
        run: npm run export:seed && git diff --exit-code ../backend/app/seed ../backend/app/engine ../backend/tests/fixtures
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: unnati, POSTGRES_PASSWORD: unnati, POSTGRES_DB: unnati }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q
      - name: Smoke test on PostgreSQL
        env: { DATABASE_URL: "postgresql://unnati:unnati@localhost:5432/unnati" }
        run: python -m app.seed --reset
