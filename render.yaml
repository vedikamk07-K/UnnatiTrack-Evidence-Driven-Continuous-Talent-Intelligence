databases:
  - name: unnatitrack-db
    plan: free
    databaseName: unnatitrack
    user: unnati
services:
  - type: web
    name: unnatitrack-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: unnatitrack-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://unnatitrack.vercel.app
